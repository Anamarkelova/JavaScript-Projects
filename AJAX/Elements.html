<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <title>Elements Challenge</title> </head> <body>

<!-- This heading will be changed using JavaScript. -->
<h1 id="heading">Original Heading</h1>

<!-- This paragraph explains what the JavaScript does. -->
<p id="message">This message will be changed.</p>

<script>
    // Use the getElementById() method to find the heading.
    document.getElementById("heading").innerHTML = "Elements Challenge";

    // Use the getElementById() method to change the paragraph.
    document.getElementById("message").innerHTML =
        "The HTML DOM Document method worked successfully!";
</script>

</body> </html>
