<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Arrow Function Assignment</title>

</head>

<body>

    <h1>JavaScript Arrow Function</h1>

    <button onclick="greeting()">Click Here</button>

    <p id="message"></p>


    <script>

        // Create a simple arrow function.
        const greeting = () => {

            document.getElementById("message").innerHTML =
                "Hello! Welcome to my JavaScript assignment.";

        };

    </script>

</body>

</html>
