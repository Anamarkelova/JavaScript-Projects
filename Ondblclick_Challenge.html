<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ondblclick Event Challenge</title>
</head>
<body>

    <h1>Double Click Challenge</h1>

    <p ondblclick="changeText()" id="message">
        Double click this paragraph!
    </p>

    <script>
        // This function changes the paragraph text when it is double clicked.
        function changeText() {
            document.getElementById("message").innerHTML =
                "You double clicked the paragraph!";
        }
    </script>

</body>
</html>
